name: TCF Canada GBLC slot monitor

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Inspect public calendar without alerts or state changes
        type: boolean
        required: true
        default: true
      notification_test:
        description: Send ONE ntfy test push (requires NTFY_TOPIC secret; no GBLC scan)
        type: boolean
        required: true
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: gblc-tcf-monitor
  cancel-in-progress: false

jobs:
  test:
    # Paused after exam booking; preserves configuration for future reactivation.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate availability parser
        run: python -m unittest discover -s tests -v
  scan:
    # Paused after exam booking; do not scan or generate alerts.
    if: ${{ false }}
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NOTIFICATION_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.notification_test && '1' || '0' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Inspect GBLC date calendar read-only
        run: python monitor.py
      - name: Upload screenshot only on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gblc-debug-screenshot
          path: gblc-error.png
          if-no-files-found: ignore
          retention-days: 3
